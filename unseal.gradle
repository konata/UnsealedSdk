// Swap the SDK platform android.jar for the unsealed jar of the version below, or put the official jar back.
// The SDK is located through ANDROID_HOME (ANDROID_SDK_ROOT as fallback), the usual rule.

import java.nio.file.Files
import java.nio.file.StandardCopyOption

def version = "37.0"

def target = {
    def home = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (!home) throw new GradleException("ANDROID_HOME is not set")
    def (major, minor) = (version.split(/\./) as List) + ["0"]
    def dir = major.toInteger() < 37 && minor == "0" ? "android-${major}" : "android-${major}.${minor}"
    def jar = file("${home}/platforms/${dir}/android.jar")
    if (!jar.exists()) throw new GradleException("no platform at ${jar.parent}; install it in SDK Manager first")
    [jar: jar,
     backup: new File(jar.parent, "android.official.jar"),
     unsealed: new File(jar.parent, "android.unsealed.jar"),
     remote: minor == "0" ? "android-${major}.jar" : "android-${major}.${minor}.jar"]
}

task unseal {
    doLast {
        def t = target()
        if (!t.backup.exists()) {
            Files.copy(t.jar.toPath(), t.backup.toPath())
            println "*** backed up official jar to ${t.backup} ***"
        }
        if (!t.unsealed.exists() || t.unsealed.length() == 0) {
            def url = "https://raw.githubusercontent.com/konata/UnsealedSdk/main/sdks/${t.remote}"
            println "*** downloading ${url} ***"
            def part = new File(t.unsealed.parent, "android.unsealed.jar.part")
            try {
                part.withOutputStream { disk -> disk << new URL(url).openStream() }
                Files.move(part.toPath(), t.unsealed.toPath(), StandardCopyOption.REPLACE_EXISTING)
            } catch (e) {
                Files.deleteIfExists(part.toPath())
                throw e
            }
        }
        Files.delete(t.jar.toPath())
        Files.copy(t.unsealed.toPath(), t.jar.toPath())
        println "*** unsealed SDK ${version} installed ***"
    }
}

task restore {
    doLast {
        def t = target()
        if (!t.backup.exists()) throw new GradleException("no backup at ${t.backup}; run unseal first or reinstall the platform")
        Files.delete(t.jar.toPath())
        Files.copy(t.backup.toPath(), t.jar.toPath())
        println "*** official SDK ${version} restored ***"
    }
}
