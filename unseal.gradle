// Unsealed SDK helper: swap the SDK platform android.jar for the unsealed jar
// matching :app's compileSdk, or put the official jar back.
//
// Put this file in the root project and add `apply from: 'unseal.gradle'` to the
// root build.gradle (applying it inside :app itself works too). The version is
// read from :app's android config, so there is nothing to set here. Reading the
// config tolerates AGP versions with or without compileSdkMinor.

import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.Paths

def unsealedApp = project.findProject(':app') ?: project

def unsealedRead = { Object target, String name ->
    try {
        target.hasProperty(name) ? target."$name" : null
    } catch (MissingPropertyException ignored) {
        null
    }
}

def unsealedTarget = {
    def android = unsealedApp.extensions.findByName('android')
    if (android == null) throw new GradleException('UnsealedSdk: :app has no android extension; apply the Android plugin first')
    def major = unsealedRead(android, 'compileSdk') ?: unsealedRead(android, 'compileSdkVersion')
    if (major == null) throw new GradleException('UnsealedSdk: :app does not configure compileSdk')
    def minor = (unsealedRead(android, 'compileSdkMinor') ?: 0) as int
    major = major as int

    def sdk = unsealedRead(android, 'sdkDirectory')
    if (sdk == null) {
        def local = new Properties()
        def props = rootProject.file('local.properties')
        if (props.exists()) props.withInputStream { local.load(it) }
        sdk = local.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    }
    if (sdk == null) throw new GradleException('UnsealedSdk: cannot locate the Android SDK (sdkDirectory, local.properties sdk.dir, and ANDROID_HOME all missing)')

    // Platform packages are named android-<major> up to 36.0 and android-<major>.<minor> from 37 on (and for every minor).
    def dir = (major >= 37 || minor > 0) ? "android-${major}.${minor}" : "android-${major}"
    def jar = Paths.get(sdk.toString(), 'platforms', dir, 'android.jar')
    if (!Files.exists(jar)) throw new GradleException("UnsealedSdk: no SDK platform at ${jar.parent}; install it in SDK Manager first")
    def file = minor > 0 ? "android-${major}.${minor}.jar" : "android-${major}.jar"
    return [jar: jar, file: file, label: "${major}.${minor}"]
}

tasks.register('unseal') {
    description = 'Replace the platform android.jar with the unsealed jar matching the compileSdk of :app.'
    group = 'unsealed'
    doLast {
        def target = unsealedTarget()
        Path using = target.jar
        Path official = using.resolveSibling('android.official.jar')
        Path unsealed = using.resolveSibling('android.unsealed.jar')
        if (!Files.exists(official)) {
            Files.copy(using, official)
            println "*** backed up official jar to ${official} ***"
        }
        if (!Files.exists(unsealed)) {
            def url = "https://raw.githubusercontent.com/konata/UnsealedSdk/main/sdks/${target.file}"
            println "*** downloading ${url} ***"
            unsealed.withOutputStream { disk -> disk << new URL(url).openConnection().inputStream }
        }
        Files.delete(using)
        Files.copy(unsealed, using)
        println "*** unsealed SDK ${target.label} installed ***"
    }
}

tasks.register('restore') {
    description = 'Put the official android.jar back.'
    group = 'unsealed'
    doLast {
        def target = unsealedTarget()
        Path using = target.jar
        Path official = using.resolveSibling('android.official.jar')
        if (!Files.exists(official)) throw new GradleException("UnsealedSdk: no backup at ${official}; run unseal first or reinstall the platform in SDK Manager")
        Files.deleteIfExists(using)
        Files.copy(official, using)
        println "*** official SDK ${target.label} restored ***"
    }
}
