name: Build Unsealed SDK

on:
  workflow_dispatch:
    inputs:
      api:
        description: SDK API level, e.g. 36, 36.1, 37.0, 37.1 (36 takes no zero minor; 37+ requires one)
        required: true
        type: string
      android_all:
        description: org.robolectric:android-all version, for example 17-robolectric-16653203 (default pinned per API)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: unsealed-sdk-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/build-unsealed.yml
            tools/build-unsealed.scala
            sdks/

      - uses: VirtusLab/scala-cli-setup@v1.12.5
        with:
          scala-cli-version: 1.9.1
          jvm: temurin:21

      - name: Validate api
        env:
          API: ${{ inputs.api }}
        run: |
          major="${API%%.*}"
          minor="${API#*.}"
          has_minor=1; [ "$minor" = "$API" ] && { minor=0; has_minor=0; }
          case "$major" in (*[!0-9]*|"") echo "::error::api '$API' is not a number"; exit 1;; esac
          case "$minor" in (*[!0-9]*|"") echo "::error::api '$API' has a non-numeric minor"; exit 1;; esac
          # Strict version form: 36 and earlier use "36" or a real minor like "36.1" (explicit ".0"
          # is rejected — Google never published such a platform); 37 and later must name the minor.
          if [ "$major" -lt 37 ] && [ "$has_minor" = 1 ] && [ "$minor" = 0 ]; then
            echo "::error::api '$API': API $major and earlier do not take an explicit zero minor; pass '$major'"
            exit 1
          fi
          if [ "$major" -ge 37 ] && [ "$has_minor" = 0 ]; then
            echo "::error::api '$API': API $major and later must name the minor explicitly, e.g. '$major.0'"
            exit 1
          fi
          echo "name=$API" >> "$GITHUB_ENV"

      - run: mkdir -p sdks

      - name: Build jar
        env:
          API: ${{ inputs.api }}
          ANDROID_ALL: ${{ inputs.android_all }}
        run: scala-cli run tools/build-unsealed.scala --server=false --runner=false -- "$API" ${ANDROID_ALL:+--android-all "$ANDROID_ALL"} --out "sdks/android-$name.jar"

      - name: Check GitHub file limit
        run: |
          size=$(stat -c%s "sdks/android-${{ env.name }}.jar")
          limit=$((100 * 1024 * 1024))
          echo "jar size: $size bytes"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::sdks/android-${{ env.name }}.jar is larger than GitHub's 100 MiB file limit"
            exit 1
          fi

      - name: Publish jar
        shell: bash
        run: |
          git config user.name "lolicon"
          git config user.email "beriru@qq.com"
          jar="sdks/android-$name.jar"
          built=$(git hash-object --no-filters "$jar")

          skip_identical() {
            if [[ $(git rev-parse --verify --quiet "$1:$jar") == "$built" ]]; then
              echo "::notice::main already has the built $jar"
              exit 0
            fi
          }

          git fetch origin main
          skip_identical FETCH_HEAD
          cp -- "$jar" "$RUNNER_TEMP/built.jar"

          # Keep the NUL-delimited diff paths in the current shell.
          shopt -s lastpipe
          sdk_jar='^sdks/android-[^/]*\.jar$'
          for attempt in {1..5}; do
            if ! git fetch origin main; then continue; fi
            old_tip=$(git rev-parse FETCH_HEAD)
            skip_identical "$old_tip"

            code_tip=
            while read -r commit; do
              subject=$(git show -s --format=%s "$commit")
              git diff-tree --root -m -r --no-renames --no-commit-id --name-only -z "$commit" |
                sort -zu | mapfile -d '' -t paths
              if [[ $subject == 'sdk: android-'* && ${#paths[@]} == 1 && ${paths[0]} =~ $sdk_jar ]]; then
                continue
              fi
              for path in "${paths[@]}"; do
                if [[ $path =~ ^sdks/[^/]*\.jar$ ]]; then
                  echo "::error::Code commit $commit touches $path. Review the SDK history before publishing."
                  exit 1
                fi
              done
              code_tip=$commit
              break
            done < <(git rev-list "$old_tip")
            if [[ -z $code_tip ]]; then
              echo "::error::No code commit below the SDK jar block at $old_tip"
              exit 1
            fi

            git reset --hard "$code_tip"
            # A code-only change above an older jar block inherits jars without touching them.
            inherited=$(git ls-files -- ':(glob)sdks/*.jar')
            if [[ -n $inherited ]]; then
              echo "::error::Code tip $code_tip already contains SDK jars. Move code below the jar block before publishing."
              exit 1
            fi

            mkdir -p sdks
            {
              printf '%s\0' "$jar"
              git ls-tree -rz --name-only "$old_tip" -- sdks/
            } | LC_ALL=C sort -zV | uniq -z | while IFS= read -r -d '' path; do
              [[ $path =~ $sdk_jar ]] || continue
              if [[ $path == "$jar" ]]; then
                cp -- "$RUNNER_TEMP/built.jar" "$path"
              else
                git checkout "$old_tip" -- "$path"
              fi
              version=${path#sdks/android-}
              git add -- "$path"
              git commit -m "sdk: android-${version%.jar}"
            done

            if git push --force-with-lease=main:"$old_tip" origin HEAD:main; then exit 0; fi
            echo "::notice::Publish attempt $attempt for $jar was rejected. Refreshing main."
          done
          echo "::error::Could not publish $jar to main after 5 attempts"
          exit 1
