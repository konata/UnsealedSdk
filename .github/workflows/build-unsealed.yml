name: Build Unsealed SDK

on:
  workflow_dispatch:
    inputs:
      api:
        description: SDK API level, 37 or later (minor allowed), for example 37 or 37.1
        required: true
        type: string
      android_all:
        description: org.robolectric:android-all version, for example 17-robolectric-16653203 (default latest for the API)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: unsealed-sdk-${{ inputs.api }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/build-unsealed.yml
            tools/build-unsealed.ts
            sdks/android-${{ inputs.api }}.jar

      - uses: oven-sh/setup-bun@v2

      - name: Validate api
        env:
          API: ${{ inputs.api }}
        run: |
          major="${API%%.*}"
          if ! [ "$major" -ge 37 ] 2>/dev/null; then
            echo "::error::api '$API' is not supported: this pipeline builds API 37 and later; jars for 36 and earlier are kept as-is"
            exit 1
          fi

      - run: mkdir -p sdks

      - name: Build jar
        env:
          API: ${{ inputs.api }}
          ANDROID_ALL: ${{ inputs.android_all }}
        run: bun run tools/build-unsealed.ts "$API" ${ANDROID_ALL:+--android-all "$ANDROID_ALL"} --out "sdks/android-$API.jar"

      - name: Check GitHub file limit
        run: |
          size=$(stat -c%s "sdks/android-${{ inputs.api }}.jar")
          limit=$((100 * 1024 * 1024))
          echo "jar size: $size bytes"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::sdks/android-${{ inputs.api }}.jar is larger than GitHub's 100 MiB file limit"
            exit 1
          fi

      - name: Commit jar
        run: |
          if [ -z "$(git status --porcelain -- "sdks/android-${{ inputs.api }}.jar")" ]; then
            echo "No jar changes"
            exit 0
          fi

          git config user.name "lolicon"
          git config user.email "beriru@qq.com"
          git add "sdks/android-${{ inputs.api }}.jar"
          git commit -m "feat: android-${{ inputs.api }} unsealed sdk"
          git push
