name: Build Unsealed SDK

on:
  workflow_dispatch:
    inputs:
      api:
        description: SDK API level, e.g. 36, 36.1, 37.0, 37.1 (36 takes no zero minor; 37+ requires one)
        required: true
        type: string
      android_all:
        description: org.robolectric:android-all version, for example 17-robolectric-16653203 (default latest for the API)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: unsealed-sdk-${{ inputs.api }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/build-unsealed.yml
            tools/build-unsealed.ts
            sdks/

      - uses: oven-sh/setup-bun@v2

      - name: Validate api
        env:
          API: ${{ inputs.api }}
        run: |
          major="${API%%.*}"
          minor="${API#*.}"
          has_minor=1; [ "$minor" = "$API" ] && { minor=0; has_minor=0; }
          case "$major" in (*[!0-9]*|"") echo "::error::api '$API' is not a number"; exit 1;; esac
          case "$minor" in (*[!0-9]*|"") echo "::error::api '$API' has a non-numeric minor"; exit 1;; esac
          # Strict version form: 36 and earlier use "36" or a real minor like "36.1" (explicit ".0"
          # is rejected — Google never published such a platform); 37 and later must name the minor.
          if [ "$major" -lt 37 ] && [ "$has_minor" = 1 ] && [ "$minor" = 0 ]; then
            echo "::error::api '$API': API $major and earlier do not take an explicit zero minor; pass '$major'"
            exit 1
          fi
          if [ "$major" -ge 37 ] && [ "$has_minor" = 0 ]; then
            echo "::error::api '$API': API $major and later must name the minor explicitly, e.g. '$major.0'"
            exit 1
          fi
          echo "name=$API" >> "$GITHUB_ENV"

      - run: mkdir -p sdks

      - name: Build jar
        env:
          API: ${{ inputs.api }}
          ANDROID_ALL: ${{ inputs.android_all }}
        run: bun run tools/build-unsealed.ts "$API" ${ANDROID_ALL:+--android-all "$ANDROID_ALL"} --out "sdks/android-$name.jar"

      - name: Check GitHub file limit
        run: |
          size=$(stat -c%s "sdks/android-${{ env.name }}.jar")
          limit=$((100 * 1024 * 1024))
          echo "jar size: $size bytes"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::sdks/android-${{ env.name }}.jar is larger than GitHub's 100 MiB file limit"
            exit 1
          fi

      - name: Commit jar
        run: |
          if [ -z "$(git status --porcelain -- "sdks/android-${{ env.name }}.jar")" ]; then
            echo "No jar changes"
            exit 0
          fi

          git config user.name "lolicon"
          git config user.email "beriru@qq.com"
          git add "sdks/android-${{ env.name }}.jar"
          git commit -m "feat: android-${{ env.name }} unsealed sdk"
          git push
